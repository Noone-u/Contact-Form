<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Us</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,minimum-scale=1.0">
    <link rel="stylesheet" href="ContactStylestyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&family=Quicksand&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="contact-box">
            <div class="left"></div>
            <form class="right">
                <h2>Contact Us</h2>
                <input type="text" class="field" placeholder="Your Name" required>
                <input type="email" class="field" placeholder="Your Email" required>
                <input type="tel" class="field" placeholder="Phone" required>
                <textarea placeholder="Message" class="field area" required></textarea>
                <button class="btn" type="submit">Send</button>
            </form>
        </div>   
    </div>
</body>
</html>
